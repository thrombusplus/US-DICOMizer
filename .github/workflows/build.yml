name: Build Windows Executable
permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write VERSION and RELEASE_DATE files from release tag
        if: github.event_name == 'release'
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $ver = $tag -replace '^v',''
          Set-Content -Path VERSION -Value $ver -NoNewline
          Write-Host "VERSION set to $ver"
          $releaseDate = (Get-Date -Format "d MMMM yyyy")
          Set-Content -Path RELEASE_DATE -Value $releaseDate -NoNewline
          Write-Host "RELEASE_DATE set to $releaseDate"

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "US-DICOMizer" --icon=icon.ico --add-data "icon.ico;." --add-data "Logo_Blue_Green_small.png;." --add-data "US-DICOMizer_manual.pdf;." app.py

      - name: Package Release
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { "${{ github.ref_name }}" }
          Compress-Archive -Path dist/US-DICOMizer.exe -DestinationPath "US-DICOMizer-Windows-$tag.zip"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: US-DICOMizer-Windows-${{ github.event.release.tag_name }}.zip

      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: US-DICOMizer-Windows
          path: ./US-DICOMizer-Windows-${{ github.ref_name }}.zip
